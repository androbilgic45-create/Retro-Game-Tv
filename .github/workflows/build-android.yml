name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Android projesi yoksa oluştur
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Web dosyalarını Android projesine senkronla
        run: npx cap sync android

      - name: Android TV manifest düzeltmeleri
        run: node scripts/patch-android-tv.js

      - name: İmzasız APK derle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK'yı imzala
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: İmzalı APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: bozkurt-arcade-release
          path: ${{ steps.sign.outputs.signedReleaseFile }}
